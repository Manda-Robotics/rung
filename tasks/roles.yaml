# tasks/roles.yaml
#
# Date: 2026-09-09
#
# Rule: committed before tuning. Moving a task from test to validation
# must be logged in docs/decisions.md, with the reason and the date.
# The reverse move (validation to test) does not need logging, since it
# only makes the frozen set stricter.
#
# Every one of the 120 RoboLab-120 tasks is assigned to exactly one role:
#   development (dev)  14 tasks
#   validation         15 tasks
#   test               30 tasks
#   full_only          61 tasks (only run in the 120-task aggregate)
#
# Tasks are grouped by template first (see tasks/README.md for the rule).
# 17 templates total. A template's tasks mostly sit in one role. The two
# large templates (put_single_in_container, put_all_of_kind_in_bin) are
# the deliberate exception: they are split across dev, validation and test
# by object identity, so each role sees different objects on the same
# skill. All other templates are kept whole within a single role, except
# where a handful of tasks were pulled out for development as pinpoint-tuned
# or failed-pinpoint probes (see why_dev on those tasks), and where test
# takes a few out-of-scope probes (stacking, counting) from otherwise
# full_only templates, clearly tagged with in_scope: false.

meta:
  date: 2026-09-09
  source_tasklist: the 120 RoboLab benchmark tasks (configs/leaderboard-tasks-b6cfcf6.json)
  source_task_impls: robolab/tasks/benchmark/*.py in RoboLab
  # The only templates allowed to span validation and test. Both are large enough
  # that keeping them whole would put a quarter of the benchmark in one role. They
  # are split by object identity, so no role sees the same object as another, and
  # the enforcing test is tests/test_task_roles.py.
  templates_split_across_roles:
    - put_single_in_container
    - put_all_of_kind_in_bin
  role_counts:
    development: 14
    validation: 15
    test: 30
    full_only: 61
  template_counts:
    pick_only: 7
    put_single_in_container: 25
    put_single_on_surface: 4
    put_all_of_kind_in_bin: 25
    put_all_of_kind_on_surface: 7
    shelf: 7
    remove_from: 5
    reorient: 4
    place_on_object: 5
    stack_on: 5
    relational_place: 5
    count_n_in: 4
    sort: 2
    pack: 6
    sequence_two: 2
    conjunction_and_place: 4
    conjunction_or_place: 3

templates:
  - id: pick_only
  - id: put_single_in_container
  - id: put_single_on_surface
  - id: put_all_of_kind_in_bin
  - id: put_all_of_kind_on_surface
  - id: shelf
  - id: remove_from
  - id: reorient
  - id: place_on_object
  - id: stack_on
  - id: relational_place
  - id: count_n_in
  - id: sort
  - id: pack
  - id: sequence_two
  - id: conjunction_and_place
  - id: conjunction_or_place

