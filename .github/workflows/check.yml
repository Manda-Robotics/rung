name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked test and optional backend dependencies
        run: uv sync --locked --all-extras
      - name: Lint and formatting
        run: make lint
      - name: Unit tests and branch coverage
        run: make coverage
      - name: Mock adapter probes and examples
        run: make probes examples
      - name: Save coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate package metadata
        run: uvx twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/rung-wheel
          uv pip install --python /tmp/rung-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/rung-wheel/bin/rung --help
          /tmp/rung-wheel/bin/rung --scene banana_in_bowl --policy scripted
          /tmp/rung-wheel/bin/rung-probes --embodiment mock
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
